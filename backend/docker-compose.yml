name: science-expert-infra

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    command:
      - sh
      - -c
      - "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""
    healthcheck:
      test:
        - CMD-SHELL
        - "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - science_expert_redis_data:/data

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26.0-community}
    container_name: science-expert-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-512m}"
    volumes:
      - science_expert_neo4j_data:/data
      - science_expert_neo4j_logs:/logs
      - science_expert_neo4j_import:/var/lib/neo4j/import
      - science_expert_neo4j_plugins:/plugins
      - ./docker/neo4j/healthcheck.sh:/docker/neo4j/healthcheck.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - sh /docker/neo4j/healthcheck.sh
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 30s

  minio:
    image: minio/minio
    container_name: science-expert-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}"
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    volumes:
      - "${MINIO_DATA_DIR:-../miniodata}:/data"

volumes:
  science_expert_redis_data:
    name: science-expert-redis-data
  science_expert_neo4j_data:
    name: science-expert-neo4j_science_expert_neo4j_data
  science_expert_neo4j_logs:
    name: science-expert-neo4j_science_expert_neo4j_logs
  science_expert_neo4j_import:
    name: science-expert-neo4j_science_expert_neo4j_import
  science_expert_neo4j_plugins:
    name: science-expert-neo4j_science_expert_neo4j_plugins
